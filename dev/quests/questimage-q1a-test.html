<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <base href="../../" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="questimage 원본 해상도를 사용하는 Q1A 미화된 초상 복원 테스트" />
    <title>Q1A 고해상도 복원 테스트</title>
    <link rel="stylesheet" href="src/highres-restoration.css" />
  </head>
  <body>
    <main class="highres-test" data-role="q1a-test">
      <header class="test-heading">
        <div>
          <h1>Q1A · 미화된 초상</h1>
          <p>questimage의 1254×1254 완성본·윤곽선을 그대로 사용하는 격리 테스트입니다.</p>
        </div>
        <span class="test-badge">본 게임 미연결</span>
      </header>

      <section class="test-layout">
        <aside class="test-panel notes-panel">
          <h2>증언 메모</h2>
          <div data-role="notes"></div>
        </aside>

        <section class="test-panel canvas-panel" aria-label="Q1A 복원 캔버스">
          <header class="canvas-toolbar">
            <p>검은 폐곡선 안을 채우거나, 큰 붓으로 같은 영역 안을 보정하세요.</p>
            <div class="zoom-controls">
              <button type="button" data-action="zoom-out" aria-label="축소">−</button>
              <span data-role="zoom-label">100%</span>
              <button type="button" data-action="zoom-in" aria-label="확대">＋</button>
            </div>
          </header>
          <div class="canvas-viewport">
            <div class="canvas-stack" data-role="canvas-stack">
              <canvas data-role="paint-canvas" aria-label="1254 곱하기 1254 복원 그림"></canvas>
              <img data-role="outline-image" alt="" aria-hidden="true" />
              <img class="reference-preview" data-role="target-preview" alt="QA용 Q1A 완성본 미리보기" hidden />
            </div>
          </div>
        </section>

        <aside class="test-panel controls-panel">
          <section class="control-group">
            <h2>팔레트</h2>
            <div class="palette" data-role="palette"></div>
          </section>

          <section class="control-group">
            <h3>도구</h3>
            <div class="button-row">
              <button type="button" data-tool="fill">영역 채우기</button>
              <button type="button" data-tool="brush">붓</button>
              <button type="button" data-tool="eraser">지우개</button>
            </div>
          </section>

          <section class="control-group">
            <h3>붓 지름</h3>
            <div class="button-row">
              <button type="button" data-brush-size="16">16px</button>
              <button type="button" data-brush-size="36">36px</button>
              <button type="button" data-brush-size="72">72px</button>
            </div>
          </section>

          <section class="control-group">
            <h3>작업</h3>
            <div class="button-row">
              <button type="button" data-action="undo" disabled>되돌리기</button>
              <button type="button" data-action="redo" disabled>다시 실행</button>
              <button type="button" data-action="reset">초기화</button>
            </div>
          </section>

          <label class="clip-option">
            <input type="checkbox" data-role="clip-toggle" />
            <span>CLIP 보조 점수 사용 — 선택 사항이며 모델을 못 불러오면 색상·채색률 점수로 자동 전환합니다.</span>
          </label>

          <button type="button" class="submit-button" data-action="submit">복원 결과 제출</button>
          <div class="result" data-role="result" hidden></div>

          <details class="debug-panel">
            <summary>QA 전용 도구</summary>
            <div class="button-row">
              <button type="button" data-action="toggle-reference">완성본 보기/숨기기</button>
              <button type="button" data-action="apply-reference">완성본 적용</button>
            </div>
            <p class="debug-score" data-role="debug-score">아직 제출하지 않았습니다.</p>
          </details>
        </aside>
      </section>

      <p class="status-line" data-role="status" aria-live="polite">초기화 중…</p>
    </main>

    <script src="scripts/scoring.js"></script>
    <script src="scripts/score-manager.js"></script>
    <script src="scripts/clip-analyzer.js"></script>
    <script src="scripts/clip-score-normalizer.js"></script>
    <script src="scripts/clip-region-preparer.js"></script>
    <script src="scripts/clip-score-manager.js"></script>
    <script src="scripts/highres-restoration-scoring.js"></script>
    <script src="src/data/questimage-quests.js"></script>
    <script src="src/highres-restoration-runtime.js"></script>
    <script src="dev/quests/q1a-highres-test.js"></script>
  </body>
</html>
