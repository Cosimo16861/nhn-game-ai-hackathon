name: Deploy playable game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify game contracts
        run: |
          node --test tests/*.test.cjs
          node --test tests/full-game-main-route.e2e.cjs

      - name: Build lean static site
        run: |
          mkdir -p _site/assets _site/scripts
          cp index.html _site/
          cp -R src fonts _site/
          cp scripts/highres-restoration-scoring.js _site/scripts/
          cp -R assets/cutscenes assets/questimage assets/q0-montage _site/assets/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
