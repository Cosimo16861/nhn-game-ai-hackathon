<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1214" />
    <title>인트로 컷신 검토</title>
    <link rel="stylesheet" href="src/intro.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="인트로 컷신 검토 화면">
      <section class="game-frame" data-role="game-frame">
        <canvas class="art-layer" data-role="art" width="640" height="384" aria-hidden="true"></canvas>
        <canvas class="text-layer" data-role="text" width="1920" height="1152" aria-hidden="true"></canvas>
        <div class="intro-ui" data-view="intro-review">
          <p class="cutscene-live" data-role="intro-live" aria-live="polite"></p>
          <div class="cutscene-meta intro-cutscene-meta">
            <div class="progress" aria-hidden="true"><span data-role="progress"></span></div>
            <p><kbd>SPACE</kbd> 문장 완성 / 다음 <span>·</span> <kbd>ESC</kbd> 현재 컷신 스킵 <span>·</span> <kbd>R</kbd> 처음부터</p>
          </div>
        </div>
      </section>
    </main>
    <script src="src/cutscene-c0-intro.js"></script>
    <script src="src/cutscene-review-intro.js"></script>
  </body>
</html>
