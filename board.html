<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>증거판 — 화면 확인용</title>
    <style>
      /* 게임 화면은 전부 640×384 캔버스 안이다. 여기 CSS 는 확인용 조작 줄 뿐이다. */
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #14100d;
        color: #9a8b74;
        font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px;
      }
      .stage { display: flex; }
      .devbar {
        display: none;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        opacity: 0.72;
      }
      .devbar.is-visible { display: flex; }
      .devbar .tag { color: #6b5c48; letter-spacing: 0.06em; }
      .devbar .step { color: #9a8b74; min-width: 190px; }
      button {
        font: inherit;
        color: #b3a88f;
        background: #241d18;
        border: 1px solid #3b2f27;
        padding: 3px 9px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #33291f; }
      button:disabled { opacity: 0.4; cursor: default; }
      label { cursor: pointer; }
    </style>
  </head>

  <body>
    <div class="stage" data-role="stage"></div>

    <div class="devbar">
      <span class="tag">확인용</span>
      <span class="step" data-role="step">—</span>
      <button type="button" data-action="prev">◀</button>
      <button type="button" data-action="next">▶</button>
      <button type="button" data-action="reset">처음으로</button>
      <label><input type="checkbox" data-action="branches" /> 가지도 함께</label>
      <span data-role="log"></span>
    </div>

    <script src="src/screen.js"></script>
    <script src="src/office.js"></script>
    <script src="src/data/quest-graph.js"></script>
    <script src="src/branchmap.js"></script>
    <script>
      (function () {
        "use strict";

        const MAIN = [
          "Q0_MONTAGE",
          "Q1A_IDEALIZED",
          "Q2A_TRUE_FACE",
          "Q3A_SEAL",
          "Q4A_LEDGER",
          "Q5A_DOCK",
          "Q6_FINALE",
        ];
        // 본선 몇 단계까지 갔을 때 따라올 수 있는 가지인가.
        const BRANCH_AFTER = {
          1: ["Q1B_TAVERN_WALL"],
          2: ["Q2B_CAT", "Q2C_CHILD_ROOM"],
          3: ["Q3B_TATTOO", "Q3C_WAREHOUSE"],
          4: ["Q4B_LOGBOOK", "Q4C_SQUARE_BET"],
          5: ["Q5B_SIREN"],
        };

        const params = new URLSearchParams(window.location.search);
        let step = Math.max(0, Math.min(MAIN.length, Number(params.get("step")) || 0));
        let withBranches = params.get("branches") === "1";

        if (params.get("dev") === "1") {
          document.querySelector(".devbar").classList.add("is-visible");
        }
        document.querySelector("[data-action=branches]").checked = withBranches;

        const flags = Object.create(null);
        const State = { has: (name) => Boolean(flags[name]) };

        const started = Date.now();
        function clock() {
          const t = Math.floor((Date.now() - started) / 1000);
          const p = (n) => String(n).padStart(2, "0");
          return p(Math.floor(t / 3600)) + ":" + p(Math.floor(t / 60) % 60) + ":" + p(t % 60);
        }

        function rebuild() {
          Object.keys(flags).forEach((k) => delete flags[k]);
          flags.CUTSCENE_SEEN_C0_INTRO = true;

          const clear = (id) => {
            const node = window.QuestGraph.get(id);
            flags["NODE_CLEARED_" + id] = true;
            flags["CUTSCENE_SEEN_" + node.cutscene] = true;
          };

          for (let i = 0; i < step; i += 1) {
            clear(MAIN[i]);
            if (withBranches) (BRANCH_AFTER[i] || []).forEach(clear);
          }

          document.querySelector("[data-role=step]").textContent =
            step === 0
              ? "인트로만 봤다 — L0만 보여야 한다"
              : "본선 " + step + "단계 · " + window.QuestGraph.get(MAIN[step - 1]).title;
          document.querySelector("[data-action=prev]").disabled = step === 0;
          document.querySelector("[data-action=next]").disabled = step >= MAIN.length;

          draw();
        }

        function draw() {
          window.BranchMap.render(State, { clock: clock() });
        }

        window.BranchMap.mount(document.querySelector("[data-role=stage]"), {
          reserveHeight: 76,
          onSelect(id) {
            document.querySelector("[data-role=log]").textContent =
              "→ " + window.QuestGraph.get(id).title;
          },
        });

        document.querySelector("[data-action=next]").addEventListener("click", () => {
          if (step < MAIN.length) step += 1;
          rebuild();
        });
        document.querySelector("[data-action=prev]").addEventListener("click", () => {
          if (step > 0) step -= 1;
          rebuild();
        });
        document.querySelector("[data-action=reset]").addEventListener("click", () => {
          step = 0;
          rebuild();
        });
        document.querySelector("[data-action=branches]").addEventListener("change", (e) => {
          withBranches = e.target.checked;
          rebuild();
        });

        window.QuestGraph.validate();
        rebuild();
        setInterval(draw, 1000);
      })();
    </script>
  </body>
</html>
