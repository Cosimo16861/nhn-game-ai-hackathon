<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1214" />
    <meta name="description" content="말로 남은 기억을 그림으로 되돌리는 복원 탐정 이야기, 안개항의 상속자" />
    <title>안개항의 상속자</title>
    <link rel="stylesheet" href="src/intro.css" />
    <link rel="stylesheet" href="src/index-workbench.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="안개항의 상속자 게임 시작 화면">
      <section class="game-frame" data-role="game-frame">
        <canvas class="art-layer" data-role="art" width="640" height="384" aria-hidden="true"></canvas>
        <canvas class="text-layer" data-role="text" width="1920" height="1152" aria-hidden="true"></canvas>

        <div class="title-ui" data-view="title">
          <p class="eyebrow">A STORY OF MEMORY &amp; INK</p>
          <h1><span>안개항의</span> 상속자</h1>
          <p class="title-en">THE HEIR OF HAVEN</p>

          <nav class="title-menu" aria-label="시작 메뉴">
            <button class="menu-button is-selected" type="button" data-action="start">
              <span class="diamond" aria-hidden="true">◆</span>
              <span data-role="start-label">새 이야기</span>
            </button>
            <button class="menu-button" type="button" data-action="replay" hidden>
              <span class="diamond" aria-hidden="true">◆</span>
              프롤로그 다시 보기
            </button>
          </nav>
          <p class="press-key">ENTER / SPACE</p>
        </div>

        <div class="intro-ui" data-view="intro" hidden>
          <div class="story-copy" data-role="story-copy" aria-live="polite"></div>
          <div class="intro-meta">
            <div class="progress" aria-hidden="true"><span data-role="progress"></span></div>
            <p><kbd>SPACE</kbd> 다음 장면 <span>·</span> <kbd>ESC</kbd> 건너뛰기</p>
          </div>
          <button class="icon-button" type="button" data-action="mute" aria-label="소리 끄기" aria-pressed="false">♪</button>
          <button class="skip-button" type="button" data-action="skip">건너뛰기</button>
        </div>

        <div class="role-card" data-view="role" hidden>
          <p class="role-kicker">당신의 역할</p>
          <h2>복원 탐정</h2>
          <div class="role-rule" aria-hidden="true"></div>
          <p>목격자의 말을 듣고,<br />기억 속 얼굴을 그림으로 되돌리십시오.</p>
          <p class="warning">당신이 그린 한 점이<br />누군가의 운명을 가릅니다.</p>
          <button class="begin-button" type="button" data-action="tutorial">
            <span>첫 번째 의뢰</span>
            튜토리얼 시작
          </button>
          <button class="replay-link" type="button" data-action="replay">프롤로그 다시 보기</button>
        </div>

        <div class="fade-layer" data-role="fade" aria-hidden="true"></div>
      </section>

      <p class="shell-note">소리를 켜고 플레이하면 더 깊이 몰입할 수 있습니다.</p>
    </main>

    <main class="index-workbench" data-role="index-workbench" aria-label="그림 복원 작업대" hidden>
      <section class="index-workbench-stage" data-role="stage"></section>
      <p class="index-workbench-help" data-role="workbench-help"></p>
    </main>

    <noscript>이 게임을 시작하려면 JavaScript를 활성화해 주세요.</noscript>
    <script src="src/screen.js"></script>
    <script src="src/workbench.js"></script>
    <script src="scripts/scoring.js"></script>
    <script src="scripts/montage-scoring.js"></script>
    <script src="src/game-progress.js"></script>
    <script src="src/data/workbench-quests.js"></script>
    <script src="src/data/workbench/q0-montage.js"></script>
    <script src="src/workbench-flow.js"></script>
    <script src="src/workbench-runtime.js"></script>
    <script src="src/index-workbench.js"></script>
    <script src="src/intro.js"></script>
  </body>
</html>
