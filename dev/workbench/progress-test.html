<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <base href="../../" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>증거판 진행 상태 테스트</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px;
        color: #9a8b74;
        background: #14100d;
        font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
        font-size: 12px;
      }
      .stage { display: flex; }
      .test-guide {
        width: min(640px, 100%);
        margin: 0;
        color: #b3a88f;
        line-height: 1.6;
        text-align: center;
      }
      .test-guide strong { color: #d8a94b; }
      .devbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        opacity: .9;
      }
      .devbar .tag { color: #d8a94b; letter-spacing: .06em; }
      .devbar .step { min-width: 190px; }
      button {
        padding: 4px 10px;
        color: #b3a88f;
        background: #241d18;
        border: 1px solid #3b2f27;
        cursor: pointer;
        font: inherit;
      }
      button:hover:not(:disabled) { background: #33291f; }
      button:disabled { opacity: .4; cursor: default; }
      label { cursor: pointer; }
    </style>
  </head>
  <body>
    <p class="test-guide">
      <strong>진행 상태 격리 테스트</strong><br />
      화살표로 본선 단계를 바꾸고 가지 퀘스트를 선택한 뒤 새로고침하세요.
      같은 증거 카드가 유지되면 저장·복원이 정상입니다. 실제 게임 저장에는 영향을 주지 않습니다.
    </p>

    <div class="stage" data-role="stage"></div>

    <div class="devbar is-visible">
      <span class="tag">테스트 전용</span>
      <span class="step" data-role="step">—</span>
      <button type="button" data-action="prev">◀ 이전</button>
      <button type="button" data-action="next">다음 ▶</button>
      <button type="button" data-action="reset">테스트 초기화</button>
      <label><input type="checkbox" data-action="branches" /> 가지도 함께</label>
      <span data-role="log"></span>
    </div>

    <script>
      window.__GAME_PROGRESS_STORAGE_KEY__ = "heir_game_progress_test_v1";
      window.__BOARD_FORCE_DEV__ = true;
    </script>
    <script src="src/screen.js"></script>
    <script src="src/office.js"></script>
    <script src="src/data/quest-graph.js"></script>
    <script src="src/game-progress.js"></script>
    <script src="src/branchmap.js"></script>
    <script src="src/board-entry.js"></script>
  </body>
</html>
