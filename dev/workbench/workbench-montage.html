<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <base href="../../" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14100d" />
    <meta
      name="description"
      content="목격자의 증언과 선화를 바탕으로 소매치기의 몽타주를 복원하는 픽셀 작업대"
    />
    <title>골목의 손 · 몽타주 작업대</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        color: #b3a88f;
        background:
          radial-gradient(circle at 50% 42%, #31251d 0, #17110e 54%, #090706 100%);
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      }
      .workbench-shell {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        padding: 12px;
      }
      .stage { position: relative; display: flex; }
      .workbench-help {
        margin: 0;
        color: #746b5e;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .04em;
        text-align: center;
      }
      .workbench-draw-surface {
        position: absolute;
        left: 29.375%;
        top: 13.28125%;
        width: 40.9375%;
        height: 68.2291667%;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: crosshair;
        touch-action: none;
        outline: none;
      }
      .workbench-draw-surface:focus-visible {
        box-shadow: inset 0 0 0 1px #d8a94b, inset 0 0 0 3px rgba(46, 36, 30, .72);
      }
      @media (max-width: 680px), (max-height: 500px) {
        .workbench-shell { gap: 5px; padding: 5px; }
        .workbench-help { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="workbench-shell" aria-label="소매치기 몽타주 복원 작업대">
      <section class="stage" data-role="stage"></section>
      <p class="workbench-help">색과 도구를 고른 뒤 선화 안을 드래그하세요 · 팔레트와 도구에 마우스를 올리면 금빛 포인터가 표시됩니다.</p>
    </main>

    <script src="src/screen.js"></script>
    <script src="src/workbench.js"></script>
    <script src="scripts/scoring.js"></script>
    <script src="scripts/montage-scoring.js"></script>
    <script src="src/data/workbench-quests.js"></script>
    <script src="src/data/workbench/q0-montage.js"></script>
    <script src="src/workbench-runtime.js"></script>
    <script src="src/workbench-entry.js"></script>
  </body>
</html>
