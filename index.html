<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1214" />
    <meta name="description" content="말로 남은 기억을 그림으로 되돌리는 복원 탐정 이야기, 안개항의 상속자" />
    <title>안개항의 상속자</title>
    <link rel="stylesheet" href="src/intro.css" />
    <link rel="stylesheet" href="src/index-workbench.css" />
    <link rel="stylesheet" href="src/game-shell.css" />
    <link rel="stylesheet" href="src/workbench/highres-workbench.css" />
  </head>
  <body>
    <!--
      제품 진입점은 이 파일 하나다. 화면은 다섯 종류뿐이며 전환은 GameDirector 만 한다.
      화면별 최상위 class 는 기존 CSS 를 그대로 쓰기 위해 유지한다.
    -->
    <main class="game-shell" data-screen="title" aria-label="안개항의 상속자 시작 화면">
      <section class="game-frame">
        <canvas class="art-layer" data-role="art" width="640" height="384" aria-hidden="true"></canvas>

        <div class="title-ui" data-view="title">
          <p class="eyebrow">A STORY OF MEMORY &amp; INK</p>
          <h1><span>안개항의</span> 상속자</h1>
          <p class="title-en">THE HEIR OF HAVEN</p>

          <nav class="title-menu" aria-label="시작 메뉴">
            <button class="menu-button is-selected" type="button" data-action="start">
              <span class="diamond" aria-hidden="true">◆</span>
              <span data-role="start-label">새 이야기</span>
            </button>
            <button class="menu-button" type="button" data-action="replay" hidden>
              <span class="diamond" aria-hidden="true">◆</span>
              프롤로그 다시 보기
            </button>
            <button class="menu-button" type="button" data-action="new-game" hidden>
              <span class="diamond" aria-hidden="true">◆</span>
              새 이야기 시작
            </button>
          </nav>
          <p class="press-key">ENTER / SPACE</p>

          <!-- 새 게임은 그린 그림까지 지운다. 되돌릴 수 없으므로 한 번 더 묻는다. -->
          <div class="title-confirm" data-role="new-game-confirm" role="alertdialog"
               aria-labelledby="new-game-confirm-text" hidden>
            <p id="new-game-confirm-text">
              지금까지의 진행과 그린 그림을 모두 지우고 처음부터 시작합니다.
            </p>
            <div class="title-confirm-actions">
              <button class="menu-button" type="button" data-action="new-game-confirm">지우고 시작</button>
              <button class="menu-button" type="button" data-action="new-game-cancel">그만두기</button>
            </div>
          </div>
        </div>
      </section>

      <p class="shell-note">소리를 켜고 플레이하면 더 깊이 몰입할 수 있습니다.</p>
    </main>

    <main class="game-shell" data-screen="cutscene" aria-label="컷신" hidden>
      <section class="game-frame">
        <canvas class="art-layer" data-role="art" width="640" height="384" aria-hidden="true"></canvas>
        <canvas class="text-layer" data-role="text" width="1920" height="1152" aria-hidden="true"></canvas>

        <div class="cutscene-ui" data-view="cutscene">
          <p class="cutscene-live" data-role="cutscene-live" aria-live="polite"></p>
          <div class="cutscene-meta">
            <div class="progress" aria-hidden="true"><span data-role="progress"></span></div>
            <p>
              <kbd>SPACE</kbd> 문장 완성 / 다음
              <span data-role="skip-hint" hidden><span>·</span> <kbd>ESC</kbd> 건너뛰기</span>
              <span>·</span> <kbd>R</kbd> 처음부터
            </p>
          </div>
        </div>
      </section>
    </main>

    <main class="board-screen" data-screen="board" aria-label="증거판" hidden>
      <div class="board-stage" data-role="board-stage"></div>
    </main>

    <main class="index-workbench" data-screen="workbench" aria-label="그림 복원 작업대" hidden>
      <section class="index-workbench-stage" data-role="workbench-stage"></section>
      <p class="index-workbench-help" data-role="workbench-help"></p>
    </main>

    <main class="board-screen" data-screen="finale" aria-label="증거의 방" hidden>
      <div class="board-stage" data-role="finale-stage"></div>
    </main>

    <div class="shell-overlay" data-role="loading-overlay" role="status" hidden>불러오는 중…</div>
    <div class="shell-overlay shell-overlay--fatal" data-role="fatal-error" role="alert" hidden>
      <p data-role="fatal-message"></p>
      <button type="button" data-role="fatal-retry">다시 시도</button>
    </div>

    <noscript>이 게임을 시작하려면 JavaScript를 활성화해 주세요.</noscript>

    <!-- 로드 순서에 의존이 있다. 아래 순서를 지킬 것. -->

    <script src="src/office.js"></script>
    <script src="src/workbench.js"></script>

    <script src="src/data/quest-graph.js"></script>
    <script src="src/data/completion-bundles.js"></script>
    <script src="src/data/questimage-quests.js"></script>
    <script src="src/data/quest-registry.js"></script>

    <script src="src/core/asset-loader.js"></script>
    <script src="src/core/progress-store.js"></script>
    <script src="src/core/artwork-store.js"></script>
    <script src="src/core/migration-v1-v2.js"></script>

    <script src="src/cutscenes/cutscene-text.js"></script>
    <script src="src/cutscenes/cutscene-registry.js"></script>
    <script src="src/cutscene-c0-intro.js"></script>
    <script src="src/cutscene-c0b.js"></script>
    <script src="src/cutscenes/legacy-opening.js"></script>
    <script src="src/cutscenes/renderers/l0-l1.js"></script>
    <script src="src/cutscenes/data/beats-l0-l1.js"></script>
    <script src="src/cutscenes/renderers/l1-l2.js"></script>
    <script src="src/cutscenes/data/beats-l1-l2.js"></script>
    <script src="src/cutscenes/renderers/l2-l3.js"></script>
    <script src="src/cutscenes/data/beats-l2-l3.js"></script>
    <script src="src/cutscenes/renderers/l3-l4.js"></script>
    <script src="src/cutscenes/data/beats-l3-l4.js"></script>
    <script src="src/cutscenes/renderers/l4-l5.js"></script>
    <script src="src/cutscenes/data/beats-l4-l5.js"></script>
    <script src="src/cutscenes/renderers/l5-l6.js"></script>
    <script src="src/cutscenes/data/beats-l5-l6.js"></script>
    <script src="src/cutscenes/renderers/l6-ending.js"></script>
    <script src="src/cutscenes/data/beats-l6-ending.js"></script>
    <script src="src/cutscenes/cutscene-player.js"></script>

    <script src="scripts/highres-restoration-scoring.js"></script>
    <script src="src/workbench/closed-regions.js"></script>
    <script src="src/workbench/paint-history.js"></script>
    <script src="src/workbench/highres-canvas.js"></script>
    <script src="src/workbench/restoration-scorer.js"></script>
    <script src="src/workbench/workbench-controller.js"></script>
    <script src="src/branchmap.js"></script>

    <script src="src/screens/title-screen.js"></script>
    <script src="src/screens/cutscene-screen.js"></script>
    <script src="src/screens/board-screen.js"></script>
    <script src="src/screens/workbench-screen.js"></script>
    <script src="src/screens/finale-screen.js"></script>

    <script src="src/app/game-shell.js"></script>
    <script src="src/app/game-director.js"></script>
    <script src="src/app/bootstrap.js"></script>
  </body>
</html>
